[package]
name = "manifold-api"
version = "0.1.0"
edition = "2021"
description = "Manifold API server - universal artifact registry"
license = "MIT"

[[bin]]
name = "manifold"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid"] }

# Configuration
figment = { version = "0.10", features = ["env", "yaml"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP types
http = "1"
bytes = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Async traits
async-trait = "0.1"

# Pin to avoid edition2024 requirement
base64ct = ">=1.0.0, <1.8"
